plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft, Fabric and library repositories itself.
	// Modrinth's maven is only used for the optional Sodium dev run (-PwithSodium).
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
	// The Hypixel Mod API (MIT). Compile-only: players get it as its own mod from Modrinth (the launcher installs it).
	exclusiveContent {
		forRepository {
			maven {
				name = 'Hypixel'
				url = 'https://repo.hypixel.net/repository/Hypixel/'
			}
		}
		filter {
			includeGroup 'net.hypixel'
		}
	}
}

loom {
	accessWidenerPath = file("src/main/resources/hollowclient.accesswidener")
}

// Automated in-game checks: `gradlew runClientGameTest` starts a real client, creates a test world,
// exercises the menus and modules and saves screenshots to build/run/clientGameTest/screenshots.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "hollowclient-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = false
		clearRunDirectory = true
	}
}

// `gradlew runClient -Pvulkan` / `gradlew runClientGameTest -Pvulkan` start the game on Minecraft's Vulkan backend
// (26.2's Video Settings -> Graphics API), to check that Hollow's drawing works there too.
if (project.hasProperty('vulkan')) {
	loom.runs.configureEach {
		programArgs "--graphicsBackend", "vulkan"
	}
}

dependencies {
	// Versions live in gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// MP3 decoding for the music player (JavaMP3, MIT license; bundled inside the mod jar)
	implementation "fr.delthas:javamp3:1.0.1"
	include "fr.delthas:javamp3:1.0.1"

	// SkyBlock Mode reads the island from the Hypixel Mod API when that mod is installed (it's optional).
	compileOnly "net.hypixel:mod-api:${project.hypixel_mod_api_version}"

	// `gradlew runClient -PwithSodium` runs the dev client with Sodium to check compatibility.
	// Sodium is never bundled in the jar; the launcher downloads it from Modrinth.
	if (project.hasProperty('withSodium')) {
		localRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xmaxerrs", "5000"]
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}
